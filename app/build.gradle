plugins { id 'com.android.application' }
def hodSigningStore = System.getenv('HOD_SIGNING_STORE')
def hodSigningPassword = System.getenv('HOD_KEYSTORE_PASSWORD')
android {
    namespace 'ru.hod.chess'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig { applicationId 'ru.hod.chess'; minSdk 29; targetSdk 36; versionCode 28; versionName '0.28.0'; ndk { abiFilters 'arm64-v8a' } }
    signingConfigs {
        persistent {
            if (hodSigningStore) storeFile file(hodSigningStore)
            storeType 'PKCS12'
            storePassword hodSigningPassword
            keyAlias 'hod'
            keyPassword hodSigningPassword
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
        }
    }
    androidResources { noCompress += ['pnn'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        debug { signingConfig signingConfigs.persistent }
        release { minifyEnabled false; signingConfig signingConfigs.persistent }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
tasks.register('verifyEngine') {
    doLast {
        def legacy = fileTree('src/main/jniLibs') { include '**/libstockfish.so', '**/*onnxruntime*.so' }
        if (!legacy.isEmpty() || file('src/main/assets/maia').exists()) {
            throw new GradleException('Retired engines found. Run python3 scripts/clean-legacy.py before building.')
        }
        if (!project.hasProperty('compactOnly')) {
            for (name in ['src/main/jniLibs/arm64-v8a/libcaissa.so', 'src/main/assets/caissa/eval-ml-8-152B-spsa.pnn', 'src/main/assets/caissa/engine.properties', 'src/main/jniLibs/arm64-v8a/libtexel.so', 'src/main/assets/texel/engine.properties']) {
                if (!file(name).isFile()) throw new GradleException('Engine bundle is missing. Run bash scripts/build-caissa.sh and bash scripts/build-texel.sh before building.')
            }
        }
    }
}
tasks.register('verifySigning') {
    doLast {
        if (!hodSigningStore || !hodSigningPassword || !file(hodSigningStore).isFile()) {
            throw new GradleException('Permanent signing key is missing. Run scripts/setup-signing-termux.sh once and prepare-signing.py before building. A new random debug key is intentionally not generated.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyEngine', 'verifySigning' }

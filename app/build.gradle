plugins { id 'com.android.application' }
android {
    namespace 'ru.hod.chess'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig { applicationId 'ru.hod.chess'; minSdk 29; targetSdk 36; versionCode 16; versionName '0.16.0'; ndk { abiFilters 'arm64-v8a' } }
    androidResources { noCompress += ['onnx'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'; implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2' }
tasks.register('verifyEngine') {
    doLast {
        if (!project.hasProperty('compactOnly') && !file('src/main/jniLibs/arm64-v8a/libstockfish.so').isFile()) {
            throw new GradleException('Stockfish is missing. Run scripts/build-stockfish.sh before building; use -PcompactOnly only for explicitly labelled development builds.')
        }
        if (!project.hasProperty('compactOnly') && (!file('src/main/assets/maia/maia3-5m.onnx').isFile() || !file('src/main/assets/maia/maia3-23m.onnx').isFile() || !file('src/main/assets/maia/models.properties').isFile())) {
            throw new GradleException('Maia-3 models are missing. Run scripts/build-maia.sh before building.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyEngine' }

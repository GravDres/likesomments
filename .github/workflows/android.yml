name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for Maia export
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36 and NDK r28c
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Test rules, engine strength, check highlights, vision and root transport
        run: bash scripts/test-core.sh
      - name: Export official Maia-3 and verify ONNX and Java parity
        run: bash scripts/build-maia.sh
      - name: Build official Stockfish 19 + NNUE for ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-stockfish.sh
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify bundled engine and package
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Package exact corresponding source
        run: python3 scripts/package-source.py --with-engine
      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Android-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Download source and engine networks
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Corresponding-Source
          path: artifacts/Hod-Source.zip
          if-no-files-found: error

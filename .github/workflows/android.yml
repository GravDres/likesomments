name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent signing key
        env:
          HOD_KEYSTORE_BASE64: ${{ secrets.HOD_KEYSTORE_BASE64 }}
          HOD_KEYSTORE_PASSWORD: ${{ secrets.HOD_KEYSTORE_PASSWORD }}
        run: python3 scripts/prepare-signing.py --output "$RUNNER_TEMP/hod-signing/hod-update.p12"
      - name: Remove retired engines after ZIP update
        run: python3 scripts/clean-legacy.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36 and NDK r28c
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
      - name: Check release lint before native builds
        env:
          HOD_KEYSTORE_PASSWORD: ${{ secrets.HOD_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace -PcompactOnly :app:lintVitalRelease
      - name: Test rules, engine strength, hint visibility, panel position, vision and root transport
        run: bash scripts/test-core.sh
      - name: Test Caissa network verification and ZIP migration
        run: python3 tests/test-caissa-build.py
      - name: Test signing, key mismatch and private source exclusions
        run: python3 tests/test-signing.py
      - name: Build Caissa + Texel, verify native protocols and compile ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export PATH="$ANDROID_HOME/cmake/3.31.6/bin:$PATH"
          bash scripts/build-caissa.sh
          bash scripts/build-texel.sh
      - name: Build installable signed APK
        env:
          HOD_KEYSTORE_PASSWORD: ${{ secrets.HOD_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify bundled engine and package
        run: |
          python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-signature.py app/build/outputs/apk/release/app-release.apk --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Package exact corresponding source
        run: python3 scripts/package-source.py --with-engine
      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Android-arm64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Download exact engine sources and networks
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Corresponding-Source
          path: artifacts/Hod-Source.zip
          if-no-files-found: error
      - name: Download lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Lint-Reports
          path: app/build/reports/lint-results*
          if-no-files-found: ignore
      - name: Download unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hod-Test-Reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/hod-signing/hod-update.p12"
